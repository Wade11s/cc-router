<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src-tauri/icons/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cc-router</title>
  </head>
  <body>
    <script>
      // 首帧前同步明暗与界面主题, 避免启动时先闪一下别的配色。
      // 键名与主题表须与 src/hooks/useTheme.tsx 的 MODE_KEY、src/themes/index.ts 的 THEMES / ART_ATTR 保持一致。
      (function () {
        var root = document.documentElement;
        var theme = "sketch";
        try {
          var t = localStorage.getItem("cc-router-theme");
          var dark =
            t === "dark" ||
            (t !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) root.classList.add("dark");
          var saved = localStorage.getItem("cc-router-ui-theme");
          if (saved === "classic" || saved === "win2000") theme = saved;
        } catch (e) {}
        root.setAttribute("data-theme", theme);
        root.setAttribute(
          "data-art",
          { sketch: "sketch", classic: "plain", win2000: "plain win2k" }[theme]
        );
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
